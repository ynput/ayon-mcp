[project]
name = "ayon-mcp"
version = "0.1.0"
description = "MCP server exposing the AYON pipeline platform to AI assistants"
readme = "README.md"
authors = [
    { name = "Milan Kolar", email = "milan@ynput.io" },
    { name = "Ynput Team", email = "team@ynput.io" }
]
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["ayon", "mcp", "pipeline", "vfx"]
dependencies = [
    "ayon-python-api>=1.0.10",
    "click~=8.4",
    "fastmcp>=3.4",
    "httpx",
    "loguru",
    "mcp>=1.28.1",
    "chuk-tool-processor>=0.26.1",
    "opentelemetry-distro>=0.65b0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "ty"
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-print>=1.3.0",
    "pytest-ayon @ git+https://github.com/ynput/pytest-ayon.git",
    "dotenv>=0.9.9",
    "anthropic",
]

[project.scripts]
ayon-mcp = "ayon_mcp.server:main"

[project.urls]
Homepage = "https://ynput.io"
Repository = "https://github.com/ynput/ayon-mcp"

[tool.ty.environment]
extra-paths = [
    "../ayon-core/client",
    "../ayon-docker/backend",
    "../ayon-python-api",
    "./services/mcp",
]

[tool.mypy]
files = ["services/mcp"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "-ra -q -m \"not llm\""
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "cli: CLI tests",
    "slow: Slow tests",
    "server: Tests that require a running AYON server",
    "llm: Tests that drive the MCP server through a real model (local Ollama or the Anthropic API)",
]
