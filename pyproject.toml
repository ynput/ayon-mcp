[project]
name = "ayon-mcp"
version = "0.1.0"
description = "MCP server exposing the AYON pipeline platform to AI assistants"
readme = "README.md"
authors = [
    { name = "Milan Kolar", email = "milan@ynput.io" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["ayon", "mcp", "pipeline", "vfx"]
dependencies = [
    "ayon-python-api>=1.0.10",
    "click~=8.4",
    "fastmcp>=3.4",
    "httpx",
    "loguru"
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
    "ty"
]

[project.scripts]
ayon-mcp = "ayon_mcp.server:main"

[project.urls]
Homepage = "https://ynput.io"
Repository = "https://github.com/ynput/ayon-mcp"

[tool.ty.environment]
extra-paths = [
    "../ayon-core/client",
    "../ayon-docker/backend",
    "../ayon-python-api",
]