[project]
name = "ayon-mcp"
version = "0.1.0"
description = "MCP server exposing the AYON pipeline platform to AI assistants"
readme = "README.md"
authors = [
    { name = "Ynput Team", email = "team@ynput.io" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["ayon", "mcp", "pipeline", "vfx"]
dependencies = [
    "loguru",
    "httpx",
    "ayon-python-api>=1.0.10",
    "fastmcp>=3.4",
]

[project.urls]
Homepage = "https://ynput.io"
Repository = "https://github.com/ynput/ayon-mcp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
