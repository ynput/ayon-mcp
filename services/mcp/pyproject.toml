[project]
name = "ayon-mcp"
version = "0.1.0"
description = "MCP server exposing the AYON pipeline platform to AI assistants"
readme = "README.md"
authors = [
    { name = "Ynput Team", email = "team@ynput.io" }
]
license = "Apache-2.0"
requires-python = ">=3.13"
keywords = ["ayon", "mcp", "pipeline", "vfx"]
dependencies = [
    "loguru",
    "httpx",
    "ayon-python-api>=1.0.10",
    "fastmcp>=3.4",
    "pydantic>=2.7",
    "click>=8.2",
    "chuk-tool-processor>=0.26.1",
    "tiktoken>=0.14.0",
    "structlog>=26.1.0",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
]

[project.urls]
Homepage = "https://ynput.io"
Repository = "https://github.com/ynput/ayon-mcp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
